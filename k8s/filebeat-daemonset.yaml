apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: observability
data:
  filebeat.yml: |
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          hints.enabled: true
          hints.default_config.enabled: false

    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers: [{ logs_path: { logs_path: "/var/log/containers/" } }]
      - add_cloud_metadata: ~
      - drop_fields:
          ignore_missing: true
          fields: [agent.ephemeral_id, host.mac, host.ip]

    output.logstash:
      hosts: ["logstash.observability.svc:5044"]

    setup.template.enabled: false
    setup.ilm.enabled: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: observability
spec:
  selector:
    matchLabels: { k8s-app: filebeat }
  template:
    metadata:
      labels: { k8s-app: filebeat }
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.15.3
          args: ["-c", "/etc/filebeat.yml", "-e"]
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          securityContext:
            runAsUser: 0
          resources:
            requests: { cpu: 100m, memory: 100Mi }
            limits:   { cpu: 500m, memory: 300Mi }
          volumeMounts:
            - { name: config,    mountPath: /etc/filebeat.yml, subPath: filebeat.yml, readOnly: true }
            - { name: data,      mountPath: /usr/share/filebeat/data }
            - { name: varlog,    mountPath: /var/log, readOnly: true }
            - { name: varlibdockercontainers, mountPath: /var/lib/docker/containers, readOnly: true }
      volumes:
        - { name: config, configMap: { name: filebeat-config, defaultMode: 0640 } }
        - { name: varlog, hostPath: { path: /var/log } }
        - { name: varlibdockercontainers, hostPath: { path: /var/lib/docker/containers } }
        - { name: data, hostPath: { path: /var/lib/filebeat-data, type: DirectoryOrCreate } }
