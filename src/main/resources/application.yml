spring:
  application:
    name: boardgame-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false          # avoids lazy-load queries happening outside any span
    properties:
      hibernate:
        format_sql: false
  threads:
    virtual:
      enabled: false

server:
  port: 8080
  shutdown: graceful             # in-flight requests finish before the pod dies
  tomcat:
    mbeanregistry:
      enabled: true              # exposes Tomcat thread-pool metrics to Micrometer
  error:
    include-message: always
    include-stacktrace: never    # never leak stack traces to clients; they go to ELK

# Version and environment travel with every log line, metric and trace.
info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:1.0.0}
deployment:
  environment: ${DEPLOY_ENV:local}

chaos:
  enabled: ${CHAOS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        # Expose deliberately. "*" is convenient and is also how heapdump ends up
        # on the public internet.
        include: health,info,metrics,prometheus,loggers,threaddump
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true            # gives you /health/liveness and /health/readiness
      group:
        readiness:
          include: db,catalogue
        liveness:
          include: ping
    loggers:
      enabled: true            # lets you change log level at runtime, no redeploy
  health:
    diskspace:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      # Explicit SLO buckets. Without these you cannot compute a meaningful p95/p99
      # and every latency alert you write will be wrong.
      slo:
        http.server.requests: 25ms,50ms,100ms,250ms,500ms,1s,2s,5s
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 10s
  observations:
    key-values:
      deployment.environment: ${DEPLOY_ENV:local}
      service.version: ${APP_VERSION:1.0.0}
  tracing:
    sampling:
      # 100% locally so every request is traceable while you learn.
      # In production start at 0.1 and use tail sampling for errors.
      probability: ${TRACE_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:8200}/v1/traces

logging:
  level:
    root: INFO
