# ============================================================================
# Filebeat -> Logstash -> Elasticsearch data streams
#
# Design rule: the app already emits ECS JSON, so this pipeline does ROUTING,
# ENRICHMENT and SAFETY, not parsing. Grok appears exactly once, to handle
# legacy plain-text lines from containers that have not been migrated yet.
# ============================================================================

input {
  beats {
    port => 5044
    client_inactivity_timeout => 600
  }
}

filter {

  # ---- 1. Identify the source -------------------------------------------
  # Docker labels tell us which compose service produced the line.
  if [container][labels][com_docker_compose_service] {
    mutate {
      add_field => { "[service][component]" => "%{[container][labels][com_docker_compose_service]}" }
    }
  }

  # ---- 2. Legacy plain-text fallback ------------------------------------
  # If a line did not arrive as JSON, Filebeat leaves the raw text in [message]
  # and does not set log.level. Parse it once, then treat it like everything else.
  if ![log][level] and [message] =~ /^\d{4}-\d{2}-\d{2}/ {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:[event][created]}%{SPACE}%{LOGLEVEL:[log][level]}%{SPACE}%{NUMBER:[process][pid]}%{SPACE}---%{SPACE}\[%{DATA:[process][thread][name]}\]%{SPACE}%{JAVACLASS:[log][logger]}%{SPACE}:%{SPACE}%{GREEDYDATA:[message]}"
      }
      tag_on_failure => ["_grok_plaintext_failed"]
      timeout_millis => 500
    }
  }

  # ---- 3. Trace correlation ---------------------------------------------
  # Micrometer Tracing writes MDC keys traceId/spanId. Rename them to the ECS
  # names Kibana APM expects, so "view trace" works from a log document.
  if [traceId] {
    mutate {
      rename => { "traceId" => "[trace][id]" }
      add_field => { "[transaction][id]" => "%{[spanId]}" }
    }
  }
  if [spanId] { mutate { rename => { "spanId" => "[span][id]" } } }

  # ---- 4. Type coercion --------------------------------------------------
  # MDC values are strings. Left alone, Elasticsearch maps duration_ms as keyword
  # and you cannot average it. This is the #1 cause of "my dashboard is empty".
  mutate {
    convert => {
      "[event][duration_ms]"         => "integer"
      "[http][response][status_code]" => "integer"
    }
  }
  mutate { uppercase => [ "[log][level]" ] }

  # ---- 5. Enrichment -----------------------------------------------------
  mutate { add_field => { "[service][environment]" => "${DEPLOY_ENV:dev}" } }

  if [http][response][status_code] {
    if [http][response][status_code] >= 500 {
      mutate { add_field => { "[event][outcome]" => "failure" } add_tag => ["server_error"] }
    } else if [http][response][status_code] >= 400 {
      mutate { add_tag => ["client_error"] }
    }
  }

  # Flag slow requests at ingest so alerting does not need a scripted query.
  if [event][duration_ms] and [event][duration_ms] > 1000 {
    mutate { add_tag => ["slow_request"] }
  }

  # ---- 6. Volume control -------------------------------------------------
  # Health-check success is the highest-volume, lowest-value log on any service.
  # Drop it at INFO; keep it when it fails, which is the only time it matters.
  if [url][path] in ["/actuator/health", "/actuator/health/liveness", "/actuator/health/readiness"]
     and [http][response][status_code] == 200 {
    drop { }
  }
  # Sample DEBUG rather than dropping it - you keep a representative trickle.
  if [log][level] == "DEBUG" {
    drop { percentage => 90 }
  }

  # ---- 7. Redaction ------------------------------------------------------
  # Never let secrets reach the index. Cheap regex here beats an incident later.
  mutate {
    gsub => [
      "message", "(?i)(password|passwd|secret|token|authorization)\s*[=:]\s*\S+", "\1=[REDACTED]",
      "message", "[\w.+-]+@[\w-]+\.[\w.]+", "[REDACTED_EMAIL]",
      "message", "\b(?:\d[ -]*?){13,16}\b", "[REDACTED_CARD]"
    ]
  }

  # ---- 8. Idempotency ----------------------------------------------------
  # A stable fingerprint means a Filebeat replay after a crash updates documents
  # instead of duplicating them.
  fingerprint {
    source => ["message", "[log][logger]", "[host][name]"]
    concatenate_sources => true
    target => "[event][id]"
    method => "MURMUR3_128"
    base64encode => true
  }

  # ---- 9. Tidy -----------------------------------------------------------
  mutate {
    remove_field => ["agent", "ecs", "input", "[log][offset]", "[log][file]", "[host][mac]"]
  }
}

output {
  # Route application logs into their own data stream so ILM and mappings are
  # ours to control; everything else keeps Beats' defaults.
  if [event][dataset] == "boardgame.app" {
    elasticsearch {
      hosts               => ["${ELASTIC_HOSTS:http://elasticsearch:9200}"]
      user                => "${ELASTIC_USER:elastic}"
      password            => "${ELASTIC_PASSWORD:changeme123}"
      data_stream         => "true"
      data_stream_type    => "logs"
      data_stream_dataset => "boardgame.app"
      data_stream_namespace => "default"
      # Retry aggressively; the persistent queue absorbs the backpressure.
      retry_on_conflict   => 3
    }
  } else {
    elasticsearch {
      hosts               => ["${ELASTIC_HOSTS:http://elasticsearch:9200}"]
      user                => "${ELASTIC_USER:elastic}"
      password            => "${ELASTIC_PASSWORD:changeme123}"
      data_stream         => "true"
      data_stream_type    => "logs"
      data_stream_dataset => "boardgame.infra"
      data_stream_namespace => "default"
    }
  }

  # Uncomment while developing the pipeline. Never leave it on: it doubles CPU.
  # stdout { codec => rubydebug }
}
